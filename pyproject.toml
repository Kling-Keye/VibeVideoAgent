[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevideo-mcp"
version = "0.1.0"
description = "Evidence-guided video production tools for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "anyio>=4", "pydantic>=2.8,<3", "requests>=2.31,<3", "Pillow>=10", "numpy>=1.24", "tomlkit>=0.12,<1"]
classifiers = ["Operating System :: POSIX", "Programming Language :: Python :: 3"]

[project.scripts]
vibevideo = "vibevideo_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
vibevideo_mcp = ["skills/vibevideo/SKILL.md"]
