[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevideo-mcp"
version = "0.2.1"
description = "Evidence-guided video production tools for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "VibeVideoAgent contributors" }]
keywords = ["mcp", "video generation", "coding agents", "claude code", "codex", "multimodal", "gemini"]
dependencies = ["mcp>=1.12,<2", "anyio>=4", "pydantic>=2.8,<3", "requests>=2.31,<3", "Pillow>=10", "numpy>=1.24", "tomlkit>=0.12,<1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Paper = "https://arxiv.org/abs/2611.34237"

[project.scripts]
vibevideo = "vibevideo_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
vibevideo_mcp = ["skills/vibevideo/SKILL.md", "skills/vibevideo/references/rendering.md"]
